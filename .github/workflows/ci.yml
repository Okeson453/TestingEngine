name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --prefer-offline
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: unit + integration tests (incl. live/acceptance.test.ts)
        run: |
          # Scripts tests
          node --test 'scripts/**/*.test.mjs'
          # App-level tests
          node --experimental-strip-types \
            --import ./scripts/paths-loader.mjs \
            --test \
            src/lib/app-data/app-data.test.ts \
            src/lib/auth/gate-identity.test.ts \
            src/lib/notifications/telegram.test.ts \
            src/lib/notifications/telegram.worker-integration.test.ts
          # Live pipeline tests (the acceptance sweep is the invariant gate)
          for t in \
            src/lib/prediction/live/integration.test.ts \
            src/lib/prediction/live/predictor.test.ts \
            src/lib/prediction/live/validator.test.ts \
            src/lib/prediction/live/cold-start-seeder.test.ts \
            src/lib/prediction/live/notification-worker.test.ts \
            src/lib/prediction/live/concurrency.test.ts \
            src/lib/prediction/live/acceptance.test.ts \
            src/lib/prediction/live/spec-acceptance.test.ts \
            src/lib/prediction/live/temporal-invariant.test.ts \
            src/lib/prediction/live/clock-skew-monitor.test.ts \
            src/lib/prediction/acie/acie-upgrade.test.ts \
            src/lib/prediction/fix-verification.test.ts; do
            node --experimental-strip-types \
              --import ./scripts/paths-loader.mjs \
              --test "$t" || (echo "LIVE TEST FAILURE: $t" && exit 1)
          done
