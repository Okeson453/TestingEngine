name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Guard against outbox/poll worker stubs
        run: |
          set -euo pipefail
          for f in src/lib/prediction/live/notification-worker.ts src/lib/prediction/live/poll-worker.ts; do
            lines=$(wc -l < "$f")
            echo "$f has $lines lines"
            if [ "$lines" -lt 300 ]; then
              echo "::error::$f is too short ($lines lines) — likely a stub regression"
              exit 1
            fi
            if grep -qE 'PLACEHOLDER_WILL_BE_REPLACED|SEE_ARTIFACTS|use full file from' "$f"; then
              echo "::error::$f contains stub marker text"
              exit 1
            fi
            if ! grep -q 'async tickOnce' "$f"; then
              echo "::error::$f missing tickOnce implementation"
              exit 1
            fi
          done
          # notification-worker must actually claim and send
          if ! grep -q 'FOR UPDATE SKIP LOCKED' src/lib/prediction/live/notification-worker.ts; then
            echo "::error::notification-worker.ts missing FOR UPDATE SKIP LOCKED claim"
            exit 1
          fi
          if ! grep -q 'sendTelegramMessage' src/lib/prediction/live/notification-worker.ts; then
            echo "::error::notification-worker.ts missing sendTelegramMessage"
            exit 1
          fi
          echo "Worker implementations look real."

      - name: Guard against committed EDGE_INGEST_TOKEN in userscripts
        run: |
          set -euo pipefail
          failed=0
          for f in scripts/bcgame-crash-edge-forwarder.user.js agents/browser-edge-observer.user.js; do
            if [ ! -f "$f" ]; then
              echo "::warning::$f missing"
              continue
            fi
            # Extract AUTH_TOKEN string literal
            token=$(python3 - <<'PY' "$f"
import re, sys
path = sys.argv[1]
text = open(path, encoding='utf-8').read()
m = re.search(r"const\s+AUTH_TOKEN\s*=\s*['\"]([^'\"]+)['\"]", text)
if not m:
    print("")
    sys.exit(0)
print(m.group(1))
PY
)
            echo "$f AUTH_TOKEN=$token"
            if [ -z "$token" ]; then
              echo "::error::$f missing AUTH_TOKEN assignment"
              failed=1
              continue
            fi
            case "$token" in
              PASTE_EDGE_INGEST_TOKEN_HERE|YOUR-*|CHANGE_ME*|placeholder*)
                echo "$f uses placeholder token (ok)"
                ;;
              *)
                echo "::error::$f AUTH_TOKEN looks like a real secret (length ${#token}). Use PASTE_EDGE_INGEST_TOKEN_HERE."
                failed=1
                ;;
            esac
          done
          exit "$failed"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit + live acceptance tests
        run: npm test
        env:
          # Force PGLite path for CI (no Neon credentials required)
          DATABASE_URL: ""
